; PHP settings for the app containers: the upload limits of C:\xampp\php\php.ini,
; so pages, uploads and the queue worker behave as they do on Windows, with
; production settings for everything else.

memory_limit = 512M
; A scan may be 200 MB (App\Support\Limits::MAX_SCAN_KB); Align sends it with
; its page image (up to 100 MB), so a request may hold both.
upload_max_filesize = 200M
post_max_size = 320M
max_input_vars = 1000
realpath_cache_size = 4096K

; Laravel sets its own time zone from config/app.php; this only silences PHP.
date.timezone = UTC

; OPcache keeps compiled PHP in memory between requests (about 100 ms saved per
; click). The code is part of the image and never changes while it runs (a new
; version is a new image), so PHP need not check the files for changes.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Production: errors go to the container's log (docker compose logs), never
; into a page, and responses do not announce the PHP version.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
