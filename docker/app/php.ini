; PHP settings for the app containers, matching C:\xampp\php\php.ini so pages,
; uploads and the queue worker behave as they do on Windows.

memory_limit = 512M
upload_max_filesize = 40M
post_max_size = 40M
max_input_vars = 1000
realpath_cache_size = 4096K

; Laravel sets its own time zone from config/app.php; this only silences PHP.
date.timezone = UTC

; OPcache keeps compiled PHP in memory between requests (about 100 ms saved per
; click). validate_timestamps + revalidate_freq 0 mean an edited file is picked
; up at once.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
