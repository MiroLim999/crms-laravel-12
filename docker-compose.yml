# CRMS in Docker: five containers that together are the whole system.
#
#   web        the website            http://localhost:8080
#   worker     outlines (Kraken) and reads (via ocr) aligned pages
#   scheduler  deletes pages nobody submitted, every hour
#   ocr        the TrOCR reading service, http://127.0.0.1:8081
#   mysql      the database (no port: only the other containers reach it),
#              encrypted on disk, its key in its own volume
#   migrate    run by hand to change the tables (docker compose run --rm migrate)
#
# Database security (docs/DOCKER-SETUP.md, "Database security"):
#   - Passwords are Docker secrets, files in docker-data/secrets made by
#     docker-start. There are no built-in passwords, and none is in .env.
#   - The website, worker and scheduler sign in as crms_app, which can only
#     read and write rows. Only migrate signs in as the owner, crms.
#   - Every table, log and backup is encrypted.
#
# The ports are 8080 and 8081, not the 8000 and 8001 that serve.ps1 uses, so a
# Windows setup on the same computer can keep running beside this one.
#
# Everyday commands, run from this folder:
#
#   docker compose up -d --build   build what changed, then start everything
#   docker compose ps              what is running
#   docker compose logs -f worker  watch one container's messages (Ctrl+C stops watching)
#   docker compose down            stop everything; data, scans and models stay
#   docker compose run --rm migrate               apply database changes after an update
#   docker compose exec mysql crms-backup   an encrypted backup
#
# The full guide, including moving to another computer, is docs/DOCKER-SETUP.md.

name: crms

# Settings the three PHP containers share. "x-app" is only a named block;
# each service below copies it in with "<<: *app".
x-app: &app
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    # The production image: no test tools, no Composer, runs as user crms.
    target: app
  image: crms-app
  # A tiny init process that cleans up the Python processes Kraken starts.
  init: true
  restart: unless-stopped
  # A process inside cannot gain privileges (setuid binaries do nothing), and
  # has none of root's special powers to begin with: the image runs as crms,
  # and every Linux capability is dropped.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # One runaway process (a fork loop, a stuck job) cannot exhaust the computer.
  pids_limit: 512
  volumes:
    # Laravel's own .env, read while the app runs (never copied into the image).
    # Read-only: the app never writes it. create_host_path: false makes a
    # missing .env an error, instead of Docker quietly creating an empty folder.
    - type: bind
      source: ./.env
      target: /var/www/html/.env
      read_only: true
      bind:
        create_host_path: false
    # Scans, crops and logs, kept in docker-data/ in this project folder so they
    # outlive the containers. Not storage/ itself: a Windows setup on the same
    # computer has its own database, whose page numbers would collide with
    # Docker's, and the two would overwrite each other's scan files.
    - ./docker-data/storage/app:/var/www/html/storage/app
    - ./docker-data/storage/logs:/var/www/html/storage/logs
  # These win over the same names in .env, because inside Docker the database
  # and the OCR service are other containers, reached by their service names.
  # Only the app's own password: rows in, rows out. Never the owner's or root's.
  secrets:
    - db_app_password
    - ocr_upload_secret
  environment: &app-env
    # Production settings whatever .env says (it is the Windows setup's, with
    # APP_DEBUG=true): no stack traces, SQL or settings shown on an error page.
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_LEVEL: warning
    # The key Laravel and the ocr service share, a secret of its own, so the
    # ocr container never holds APP_KEY (config/services.php).
    OCR_UPLOAD_SECRET_FILE: /run/secrets/ocr_upload_secret
    # Host names the site answers to, besides APP_URL's (config/crms.php).
    CRMS_TRUSTED_HOSTS: ${CRMS_TRUSTED_HOSTS:-localhost,127.0.0.1}
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: crms
    DB_USERNAME: crms_app
    DB_PASSWORD_FILE: /run/secrets/db_app_password
    OCR_API_URL: http://ocr:8001
    # The browser is not inside Docker, so it cannot use the name "ocr": it
    # uploads models to the port published below. Without this line Laravel
    # would hand the browser OCR_API_URL (config/services.php).
    OCR_BROWSER_API_URL: http://127.0.0.1:8081
    # Browsers keep one set of cookies per host name, whatever the port, so
    # localhost:8080 and a Windows setup on localhost:8000 would share the login
    # cookie, and signing in to one would sign you out of the other.
    SESSION_COOKIE: crms_docker_session
    # The Set up CRMS page normally opens only on the CRMS computer itself. Inside
    # Docker every request comes from Docker's network, never 127.0.0.1, so the
    # address check is off here. The page asks for a one-time setup token
    # instead, which only this computer can read:
    #   docker compose exec web php artisan crms:setup-token
    CRMS_SETUP_LOCAL_ONLY: "false"
  depends_on:
    mysql:
      condition: service_healthy

services:
  web:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    environment:
      <<: *app-env
      # Four PHP processes answer requests at once (Linux can; Windows could not).
      PHP_CLI_SERVER_WORKERS: "4"
    # Four PHP processes of up to 512 MB each (php.ini memory_limit). A flood of
    # huge uploads stops here instead of taking the computer's memory. Set
    # CRMS_WEB_MEMORY in .env to change it.
    mem_limit: ${CRMS_WEB_MEMORY:-2g}
    ports:
      # 127.0.0.1: only this computer can open the site; phones and other
      # computers on the same network cannot.
      - "127.0.0.1:8080:8000"

  worker:
    <<: *app
    # Same flags as serve.ps1. If it stops (php artisan queue:restart, a crash),
    # Docker starts it again, as serve.ps1's restart loop does on Windows.
    command: php artisan queue:work --timeout=900 --tries=1
    # Time to finish the page it is working on before "docker compose down"
    # stops it: a page takes about 2 minutes on the processor. A page cut off
    # halfway is stuck until the queue gives up on it (retry_after, 16 minutes)
    # and marks it failed.
    stop_grace_period: 3m
    # Kraken and torch outline a page in a few GB. A bad scan that would use more
    # stops this container (and its page fails) instead of the whole computer.
    # Set CRMS_WORKER_MEMORY in .env to change it.
    mem_limit: ${CRMS_WORKER_MEMORY:-6g}
    # Up to LINE_MARKERS_WORKERS Kraken processes, each with torch's threads.
    pids_limit: 1024
    depends_on:
      mysql:
        condition: service_healthy
      ocr:
        condition: service_started

  scheduler:
    <<: *app
    command: php artisan schedule:work
    mem_limit: 512m

  # Changes the tables (php artisan migrate) as the owner account, then stops.
  # Not started by "up": run it after an update with
  #   docker compose run --rm migrate
  # (add --seed the first time). The running app never holds the owner's password.
  migrate:
    <<: *app
    profiles: ["tools"]
    restart: "no"
    secrets:
      - db_owner_password
      - ocr_upload_secret
    environment:
      <<: *app-env
      DB_USERNAME: crms
      DB_PASSWORD_FILE: /run/secrets/db_owner_password
    entrypoint: ["php", "artisan", "migrate", "--force"]
    command: []

  # The tests, inside Docker, against their own database (crms_test, never the
  # real records). Built from the test image, which has PHPUnit; the running
  # app's image does not. Not started by "up":
  #   docker compose run --rm --build test
  test:
    <<: *app
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: test
    image: crms-app-test
    profiles: ["tools"]
    restart: "no"
    # Only .env: never docker-data, so a test that writes files can never touch
    # real scans. Its files stay inside the container and go with it.
    volumes:
      - type: bind
        source: ./.env
        target: /var/www/html/.env
        read_only: true
        bind:
          create_host_path: false
    command: ["php", "artisan", "test"]

  ocr:
    build:
      context: .
      dockerfile: docker/ocr/Dockerfile
    image: crms-ocr
    init: true
    restart: unless-stopped
    # Runs as user crms (docker/ocr/Dockerfile) with no Linux capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024
    # TrOCR in memory plus the pages being read. Set CRMS_OCR_MEMORY in .env to
    # change it (more for the GPU build or a larger model).
    mem_limit: ${CRMS_OCR_MEMORY:-6g}
    # No .env here: this container parses images and model files, so it holds
    # only its own signing key, never APP_KEY or anything else in .env.
    secrets:
      - ocr_upload_secret
    environment:
      OCR_UPLOAD_SECRET_FILE: /run/secrets/ocr_upload_secret
      # Docker Compose fills these in from .env in this folder, if set there.
      OCR_DEVICE: ${OCR_DEVICE:-auto}
      OCR_PRECISION: ${OCR_PRECISION:-fp16}
      # OCR_BROWSER_ORIGIN_REGEX is left to the service's default (localhost and
      # 127.0.0.1 on any port); its "$" does not survive Compose's substitution.
    volumes:
      # The model folders (about 1.3 GB each), shared rather than copied.
      - ./ml/models:/app/ml/models
    ports:
      # The browser uploads models straight to the service (OCR_BROWSER_API_URL).
      - "127.0.0.1:8081:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    # MySQL 9.7 with encryption on disk (docker/mysql/Dockerfile).
    build:
      context: docker/mysql
    image: crms-mysql
    # MySQL's own start-up script runs as root only to hand the data folders to
    # the mysql user, then MySQL itself runs as mysql. It needs those few root
    # powers, so its capabilities stay; nothing in it can gain more.
    security_opt:
      - no-new-privileges:true
    # Philippine time (+08:00), like the MySQL service on Windows (time_zone
    # SYSTEM). Every date column is a TIMESTAMP, which MySQL converts by this
    # setting: on UTC, all existing dates would show 8 hours off.
    command: --default-time-zone=+08:00
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crms
      MYSQL_USER: crms
      MYSQL_PASSWORD_FILE: /run/secrets/db_owner_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_root_password
      - db_owner_password
      - db_app_password
      - backup_passphrase
    volumes:
      # The database files, in a Docker volume that survives "docker compose down".
      # Only "docker compose down -v" deletes it - do not use -v.
      - mysql-data:/var/lib/mysql
      # The encryption key, apart from the data. Lose it and the data volume
      # cannot be read: the encrypted backups (crms-backup) do not need it.
      - mysql-keyring:/var/lib/mysql-keyring
      # Runs once on the first start: creates crms_test for the tests.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      # Database backups and imports: a .sql file in docker-data/backups on this
      # computer is /backups inside the container (docs/DOCKER-SETUP.md has the commands).
      - ./docker-data/backups:/backups
    # No ports: nothing outside Docker can reach the database, only the other
    # containers. Backups go through docker-data/backups above.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
  mysql-keyring:

# Made by docker-start (random, letters and digits) when missing. Keep a copy
# of docker-data/secrets somewhere safe, apart from the backups.
secrets:
  db_root_password:
    file: ./docker-data/secrets/db_root_password
  db_owner_password:
    file: ./docker-data/secrets/db_owner_password
  db_app_password:
    file: ./docker-data/secrets/db_app_password
  backup_passphrase:
    file: ./docker-data/secrets/backup_passphrase
  # Signs model uploads and authenticates Laravel to the ocr service.
  ocr_upload_secret:
    file: ./docker-data/secrets/ocr_upload_secret
